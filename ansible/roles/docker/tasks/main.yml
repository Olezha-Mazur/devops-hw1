---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create directory for Docker signing keys
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true

- name: Configure the official Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ deb_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: true
  vars:
    deb_architecture: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker starts now and after a reboot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create the deployer user
  ansible.builtin.user:
    name: deployer
    shell: /bin/bash
    create_home: true
    groups: docker
    append: true

- name: Permit deployer to use sudo without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/deployer
    content: "deployer ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Create application directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: deployer
    group: deployer
    mode: '0755'
