[defaults]
# Keep controller temporary files inside the project instead of ~/.ansible.
# This is convenient on managed workstations where the home directory is read-only.
home = ./.ansible
inventory = inventory.ini
local_tmp = ./.ansible/tmp
collections_path = ./.ansible/collections:/usr/share/ansible/collections
remote_tmp = /tmp/.ansible-${USER}/tmp
interpreter_python = auto_silent
host_key_checking = True

[ssh_connection]
pipelining = True
