services:
  nginx:
    image: nginx:1.27-alpine
    container_name: homework-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  app:
    image: nginx:1.27-alpine
    container_name: homework-app
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app_net
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
